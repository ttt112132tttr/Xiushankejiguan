<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵狐搜索 - LINGHU SEARCH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 粒子背景画布 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 艺术字标题 */
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 0.3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff8a80 0%, #ff5252 25%, #80deea 50%, #b2ebf2 75%, #e0f7fa 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease infinite;
            text-shadow: 0 0 40px rgba(255, 138, 128, 0.2);
            cursor: default;
            user-select: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 0.9rem;
            color: #b0bec5;
            letter-spacing: 0.5em;
            margin-bottom: 50px;
            opacity: 0.7;
        }

        /* 搜索框 */
        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 40px;
        }

        .search-input {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 138, 128, 0.3);
            border-radius: 50px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 138, 128, 0.1), inset 0 0 20px rgba(128, 222, 234, 0.05);
        }

        .search-input:focus {
            border-color: rgba(128, 222, 234, 0.6);
            box-shadow: 0 0 30px rgba(255, 138, 128, 0.2), 0 0 40px rgba(128, 222, 234, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .search-input::placeholder {
            color: #78909c;
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            padding: 12px 25px;
            background: linear-gradient(135deg, rgba(255, 138, 128, 0.8), rgba(128, 222, 234, 0.8));
            border: none;
            border-radius: 50px;
            color: #0a0e1a;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 138, 128, 0.4);
        }

        /* 搜索结果区域 */
        .results-area {
            width: 100%;
            max-width: 700px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 138, 128, 0.15);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, #ff8a80, #80deea);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(128, 222, 234, 0.4);
            transform: translateX(5px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(128, 222, 234, 0.1);
        }

        .result-card:hover::before {
            opacity: 1;
        }

        .result-title {
            font-size: 1.1rem;
            color: #ffccbc;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .result-meta {
            font-size: 0.8rem;
            color: #78909c;
        }

        .no-result {
            text-align: center;
            color: #546e7a;
            padding: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
        }

        /* 模态框 - 文件查看器 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 138, 128, 0.3);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 138, 128, 0.15), 0 0 80px rgba(128, 222, 234, 0.1);
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .modal-title {
            font-size: 1.3rem;
            color: #ffccbc;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 138, 128, 0.2);
            border-color: #ff8a80;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
            line-height: 1.8;
            color: #cfd8dc;
            font-size: 0.95rem;
        }

        .modal-body h3 {
            color: #ffab91;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .modal-body p {
            margin-bottom: 12px;
            text-align: justify;
        }

        .modal-image {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            display: block;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-image.full {
            max-width: 100%;
            margin: 0;
        }

        /* 笑脸密码翻译器 */
        .translator-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px;
        }

        .translator-inputs {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .translator-input {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 138, 128, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        .translator-input:focus {
            border-color: #80deea;
            box-shadow: 0 0 15px rgba(128, 222, 234, 0.2);
        }

        .smiley-face {
            font-size: 3rem;
            color: #ffcc80;
            animation: pulse 2s infinite;
            user-select: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .translate-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #ff8a80, #80deea);
            border: none;
            border-radius: 25px;
            color: #0a0e1a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.2em;
        }

        .translate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 138, 128, 0.4);
        }

        .translate-result {
            min-height: 30px;
            font-size: 1.2rem;
            color: #80deea;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .translate-result.error {
            color: #ff8a80;
        }

        /* 锁定模态框特殊样式 */
        .lock-field {
            margin-bottom: 15px;
        }
        .lock-field label {
            display: block;
            color: #80deea;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .lock-field input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 138, 128, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .lock-field input:focus {
            border-color: #80deea;
            box-shadow: 0 0 15px rgba(128, 222, 234, 0.2);
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #ff8a80, #80deea);
            border-radius: 4px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .logo {
                font-size: 2.8rem;
                letter-spacing: 0.2em;
            }
            .translator-inputs {
                flex-direction: column;
            }
            .smiley-face {
                order: -1;
            }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <div class="logo">灵狐搜索</div>
        <div class="subtitle">LINGHU SEARCH ENGINE</div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词进行精确检索..." autocomplete="off">
            <button class="search-btn" onclick="performSearch()">检索</button>
        </div>

        <div class="results-area" id="resultsArea"></div>
    </div>

    <!-- 文件查看模态框 -->
    <div class="modal-overlay" id="fileModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">文件标题</div>
                <button class="modal-close" onclick="closeModal('fileModal')">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 笑脸密码翻译器模态框 -->
    <div class="modal-overlay" id="translatorModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <div class="modal-title">:) 笑脸密码翻译器</div>

            </div>
            <div class="modal-body">
                <div class="translator-box">
                    <div class="translator-inputs">
                        <input type="text" class="translator-input" id="leftInput" placeholder="左侧输入...">
                        <div class="smiley-face">:)</div>
                        <input type="text" class="translator-input" id="rightInput" placeholder="右侧输入...">
                    </div>
                    <button class="translate-btn" onclick="translateSmiley()">翻译</button>
                    <div class="translate-result" id="translateResult"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 锁定验证模态框 -->
    <div class="modal-overlay" id="lockedModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <div class="modal-title" style="color: #ff8a80;">⚠ 访问受限</div>
                <button class="modal-close" onclick="closeModal('lockedModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color: #ffab91; margin-bottom: 25px; line-height: 1.6;">该档案已被网站管理员锁定。<br>请输入三个粒子发射场的位置以验证身份。</p>
                <div style="margin-bottom: 25px;">
                    <div class="lock-field">
                        <label>英国：</label>
                        <input type="text" id="ukInput" placeholder="输入地点...">
                    </div>
                    <div class="lock-field">
                        <label>日本：</label>

                    </div>
                    <div class="lock-field">
                        <label>大云市：</label>
                        <input type="text" id="dyInput" placeholder="输入地点...">
                    </div>
                </div>
                <div id="lockError" style="color: #ff8a80; text-align: center; min-height: 24px; margin-bottom: 15px; font-size: 0.9rem; font-weight: 600;"></div>
                <button class="translate-btn" onclick="verifyLock()" style="width: 100%;">确定</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 粒子特效系统 ====================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.life = 0;
                this.maxLife = Math.random() * 200 + 100;
                
                const colors = [
                    'rgba(255, 138, 128, 0.6)',
                    'rgba(255, 107, 107, 0.5)',
                    'rgba(128, 222, 234, 0.6)',
                    'rgba(178, 235, 242, 0.5)',
                    'rgba(255, 204, 188, 0.4)',
                    'rgba(224, 247, 250, 0.5)'
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;
                
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                if (this.life >= this.maxLife) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 120; i++) {
            particles.push(new Particle());
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        const opacity = (1 - distance / 120) * 0.15;
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(128, 222, 234, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(255, 138, 128, 0.03)');
            gradient.addColorStop(0.5, 'rgba(128, 222, 234, 0.03)');
            gradient.addColorStop(1, 'rgba(255, 138, 128, 0.03)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawConnections();
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        animate();

        // ==================== 搜索数据库 ====================
        const database = {

                        <p><strong>王崇明</strong></p>
                    `
                }
            ],
            "阿尔法号": [
                {
                    id: 2,
                    title: "星海落幕，器物归航：阿尔法号飞船正式移交洛杉矶团队完成全权回收",
                    type: "doc",
                    content: `
                        <h3>星海落幕，器物归航：阿尔法号飞船正式移交洛杉矶团队完成全权回收</h3>

                        <p>据悉，"阿尔法号"民用载人飞船由大云市航天领域资深专家赵立文教授，携手洛杉矶市顶尖航天科学家阿迪金森·帕特及其团队联合耗时数年打磨研制，是两市跨国科创协作的标志性成果。飞船全程在大云市航天发射区完成装配、调试、核验与发射任务，承载着两地科研团队的心血与期许，顺利完成火星登陆、实地探测、数据采集、星际环境取样等一系列高难度既定任务，创下民用载人航天火星探测的全新纪录。</p>
                        <p>本次星际航行任务由大云市市委书记、休山科技馆馆主王崇明全程统筹保障，林夜冬担任项目统筹负责人，赵立文担任总技术负责人，三人共同随船执行本次火星探测科考任务。漫长的深空航行与复杂的星际环境，对人体机能造成了不可逆的剧烈损耗，返航落地后，三名随行人员均出现不同程度的深空辐射反应与身体机能紊乱症状。</p>
                        <p>经过大云市医疗专班紧急救治，王崇明身体各项指标逐步趋于平稳，已脱离危险，持续接受后续医学观察。但林夜冬、赵立文二人因长期高强度攻坚科研工作，叠加深空极端环境损伤，多脏器严重衰竭，伤情危重，经医疗团队全力抢救数小时后，最终不幸宣告殉职，为这场盛大的星海探索付出了生命的代价。</p>
                        <p>英雄落幕，器物归航。在悲痛与缅怀的氛围中，阿尔法号飞船的后续处置工作严格依照跨国合作协议稳步推进。作为本次火星探测任务唯一的在轨载体，阿尔法号储存了完整的火星地表探测数据、星际航行环境数据、深空影像资料与珍贵科研样本，是整项工程最核心的实物成果。</p>
                        <p>按照合作权责划分，洛杉矶团队已完成对阿尔法号飞船的现场核验、设备清点、整体封存与专业转运工作，实现全流程闭环回收。后续美方科研团队将对飞船船体、机载探测系统、航行记录终端、生命保障设备等核心装置进行全方位拆解检测、技术复盘与数据分析，系统研判民用载人深空航行的设备损耗规律、深空环境影响参数，持续优化民用航天载人技术、长距离星际续航与深空安全防护体系。</p>
                        <p>此次跨国回收工作全程公开规范，大云市科创部门全程同步备案、留存核心备份数据，确保两地科研成果共享互通、技术经验双向沉淀。一边是两名科研工作者以生命赴使命的悲壮牺牲，一边是跨境科创协作稳步推进、航天技术持续迭代的行业突破。</p>
                        <p>王崇明在受访中表示，阿尔法号的成功返航与完整回收，印证了跨境民用航天合作的可行性与先进性，而林夜冬与赵立文的牺牲，是本次探索之路最沉重、也最珍贵的勋章。未来大云市将持续传承科研人员不畏艰险、奔赴未知的探索精神，依托休山科技馆科创平台，持续深耕深空科普与航天科研领域，让每一次星海奔赴、每一份热血付出，都成为人类探索宇宙的前行微光。更多详情见青樾论坛。</p>
                        <p>截至目前，飞船回收转运工作全部完成，相关科研复盘工作即将启动，殉职人员善后抚恤与事迹梳理工作同步有序推进。</p>

                        <h3>伦敦地质学家休谟·阿尔金到访大云市学术交流纪实</h3>
                        <p>休谟·阿尔金是英国伦敦知名资深地质学家，担任伦敦地质学会终身理事、伦敦大学地球深部构造学科首席教授，常年深耕深海地层演变、板块运动动力学与地下深层地质结构研究，是全球深地深海研究领域的权威学者。应大云市科学院与休山地质实验中心诚挚邀请，休谟·阿尔金携伦敦地质研究所科研团队一行抵达大云市，开启为期数日的专业学术访问与科研交流工作。作为拥有完整滨海沉积地质剖面、顶尖深地探测实验设备的科创城市，大云市在海陆交互地质研究、地下空间地质勘测、近海板块动态监测等领域拥有独特的资源优势与科研实力，也是阿尔金此次亚洲学术调研行程中的核心站点。</p>
                        <p>抵达大云市后，休谟·阿尔金团队第一时间参与市内地质科研座谈交流。大云市科研团队详细介绍了本地地质地貌特征与科研布局，依托独特的滨海丘陵地形，大云市完整保留了多纪元海陆交替岩层遗迹，配套建设的地下恒温标本库、深海岩芯分析平台、深部地质模拟装置，为近海地质研究、城市地下基建安全勘测、地热资源开发研究提供了坚实支撑。阿尔金结合自身数十年大西洋深海探测、英伦群岛海底断裂带研究经验，现场对比了大西洋与西太平洋板块运动的差异特征，针对大云市近海地层滑移风险、深层地下工程地质稳定性等关键问题，分享了国际前沿研究思路与勘测技术经验，为本地地质科研与城市安全建设提供了全新参考。</p>
                        <p>在市科研团队的陪同下，阿尔金团队实地走访参观了大云市核心科研载体，重点考察了休山地下镜面实验大厅与深海岩芯标本馆。面对可模拟深海高压环境的深部实验装置、可实现地层精准观测的镜面监测系统，以及馆藏齐全的西太平洋海底钻探岩芯、本地山体变质岩标本，阿尔金给予了高度评价。他细致观察岩层样本、记录实验设备参数，充分认可大云市深地模拟实验技术的国际先进性，认为本地完整的地质标本体系，有效弥补了欧洲近海地质模拟研究的短板，具备极高的科研价值。双方科研人员围绕岩层年代测定、同位素检测、岩芯样本分析等核心实验技术展开深入交流，初步达成跨国岩芯样本共享、实验技术互通的合作意向。</p>
                        <p>为贴近实地地质研究场景，团队一同前往大云南郊野外地质剖面带开展实地踏勘。此处裸露的山体岩层清晰留存着古海陆变迁痕迹，层次分明的海相沉积岩层与褶皱结构，完整记录了百万年来的地质演化过程，是极为稀缺的天然地质研究样本。阿尔金在野外现场开展实操交流，细致讲解岩层褶皱、海蚀夹层的形成机理，对比东西方同地质纪元的地层演化差异，带领两地青年科研人员采集岩石标本、记录地层剖面数据，在实地勘探中完成学术交流与技术传帮带。</p>
                        <p>访问期间，休谟·阿尔金在大云市科学院开展公开学术报告，面向全市地质科研从业者、高校相关专业师生，分享了大西洋洋壳深部构造研究成果与数十年深海探测数据。他结合国际前沿研究理论，结合大云本地地质勘探实际，深度剖析了板块俯冲运动对滨海城市地下地质结构的长期影响，针对城市深层地下室、地下隧道等基建工程的地质勘测标准、风险预警体系提出优化建议。报告结束后，现场开展深度研讨交流，参会人员围绕深海资源勘探、地质灾害防控、地下空间安全开发等核心课题积极提问，与阿尔金展开热烈探讨，催生多项全新的科研合作思路。</p>
                        <p>此次访问尾声，伦敦地质研究所与大云市科学院正式达成长期战略合作，签署科研合作备忘录。双方约定共建大洋深部地质联合实验室，常态化开展学者互访、科考数据共享、联合海上地质科考等项目，搭建稳定的国际学术交流平台，持续培育地质领域青年科研人才。</p>
                        <p>临别之际，休谟·阿尔金对此次大云之行给予高度肯定。他表示，大云市得天独厚的完整地质露头、顶尖的深地深海科研设备、成熟的地质研究体系，让人印象深刻，尤其是休山地下实验空间与完备的岩芯馆藏，为全球板块动力学研究提供了独一无二的研究样本。他期待两地能够持续深化跨洋科研联动，整合双方技术与资源优势，共同深耕大洋地壳演化、滨海地质安全等前沿领域，助力全球深地深海地质研究实现新突破。此次国际学术访问，有效打通了伦敦与大云的地质科研交流通道，推动国际前沿地质理论与本地科研实践深度融合，为大云市打造世界级海陆地质科研高地筑牢了坚实的国际合作基础。</p>
                    `
                },

                    type: "doc",
                    content: `
                        <h3>喜报！我市科学家陈爱伦与国际权威学者休谟·阿尔金联合发表高水平学术成果</h3>
                        <p>喜讯传来！在大云市与伦敦地质科研领域深度联动、跨国学术交流取得丰硕成果的关键阶段，我市优秀地质科研工作者陈爱伦与英国伦敦知名权威地质学家休谟·阿尔金携手合作，依托双方深耕深地深海地质研究的扎实积淀，顺利在《Object a》权威学术期刊联合发表重磅科研论文，为我市国际地质科研合作再添标志性成果。</p>
                        <p>休谟·阿尔金作为伦敦地质学会终身理事、伦敦大学地球深部构造学科首席教授，是全球板块动力学、大洋基底岩层演化领域的顶尖学者，拥有数十年深海地质探测与地层研究经验。陈爱伦研究员深耕大云市海陆交互地质、地下深层地质安全研究一线多年，长期依托大云市得天独厚的地质样本资源与顶尖深地实验平台，聚焦滨海地层演化、近海板块运动、地下空间地质风险防控等核心课题开展专项研究，积累了大量本土实测数据与扎实研究成果。</p>

                        <p>下一步，大云市科学院将持续深化与伦敦地质研究所的长期战略合作，依托共建的大洋深部地质联合实验室平台，持续推进跨国科研攻关、学术交流、人才培育等多项工作，鼓励本土科研人员深耕前沿、接轨国际，持续产出更多高水平、高价值的学术成果，全力助推大云市打造世界级海陆地质科研高地。</p>

                        <h3>小保泽钢敲定代々木公園为粒子死亡发生场科研选址</h3>

                        <p>此次选址落地，标志着日本粒子衰变基础研究迈入全新阶段。小保泽钢团队将依托代々木公園的天然科研优势，稳步推进装置搭建、调试与常态化实验工作，持续深耕基础粒子科学前沿领域，为全球微观物理研究积累珍贵的实测数据与科研成果。</p>

                } else if (item.type === 'link') {
                    html += `
                        <div class="result-card" onclick="window.open('${item.url}', '_blank')">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">外部链接 | 点击跳转</div>
                        </div>
                    `;
                } else if (item.type === 'locked') {
                    html += `
                        <div class="result-card" onclick="openLockedModal()">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">${item.desc} | 点击验证访问</div>
                        </div>
                    `;
                } else if (item.type === 'image') {
                    html += `
                        <div class="result-card" onclick="openImage(${item.id})">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">影像档案: IMG-${String(item.id).padStart(3, '0')} | 点击查看原图</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="result-card" onclick="openFile(${item.id})">
                            <div class="result-title">${item.title}</div>
                            <div class="result-meta">档案编号: DOC-${String(item.id).padStart(3, '0')} | 点击查阅详情</div>
                        </div>
                    `;
                }
            });
            
            resultsArea.innerHTML = html;
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        // ==================== 文件查看器 ====================
        function openFile(id) {
            let file = null;
            for (let key in database) {
                const found = database[key].find(item => item.id === id && item.type === 'doc');
                if (found) {
                    file = found;
                    break;
                }
            }
            
            if (!file) return;

            document.getElementById('modalTitle').textContent = file.title;
            
            let bodyContent = file.content;
            if (file.hasImage && file.imageUrl) {
                bodyContent += `<img src="${file.imageUrl}" alt="配图" class="modal-image" onerror="this.style.display='none'">`;
            }
            
            document.getElementById('modalBody').innerHTML = bodyContent;
            document.getElementById('fileModal').classList.add('active');
        }

        function openImage(id) {
            let file = null;
            for (let key in database) {
                const found = database[key].find(item => item.id === id && item.type === 'image');
                if (found) {
                    file = found;
                    break;
                }
            }
            
            if (!file) return;

            document.getElementById('modalTitle').textContent = file.title;
            document.getElementById('modalBody').innerHTML = `
                <img src="${file.imageUrl}" alt="${file.title}" class="modal-image full" onerror="this.parentElement.innerHTML='<p style=\\'text-align:center;color:#ff8a80\\'>图片加载失败</p>'">
            `;
            document.getElementById('fileModal').classList.add('active');
        }

        function openTranslator() {
            document.getElementById('translatorModal').classList.add('active');
            document.getElementById('translateResult').textContent = '';
            document.getElementById('leftInput').value = '';
            document.getElementById('rightInput').value = '';
        }

        function openLockedModal() {
            document.getElementById('lockedModal').classList.add('active');
            document.getElementById('ukInput').value = '';
            document.getElementById('jpInput').value = '';
            document.getElementById('dyInput').value = '';
            document.getElementById('lockError').textContent = '';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 点击遮罩关闭
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // ==================== 笑脸密码翻译器 ====================
        function translateSmiley() {
            const left = document.getElementById('leftInput').value.trim();
            const right = document.getElementById('rightInput').value.trim();
            const result = document.getElementById('translateResult');

            if (left === 'Hello' && right === 'We see you') {
                result.textContent = '麓睢市';
                result.classList.remove('error');
            } else {
                result.textContent = '无法翻译';
                result.classList.add('error');
            }
        }

        document.getElementById('rightInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') translateSmiley();
        });

        // ==================== 锁定验证 ====================
        function verifyLock() {
            const uk = document.getElementById('ukInput').value.trim().toUpperCase();
            const jp = document.getElementById('jpInput').value.trim();
            const dy = document.getElementById('dyInput').value.trim();
            const error = document.getElementById('lockError');
            
            if (uk === 'DARTFORD MARSHES' && jp === '代々木公園' && dy === '空眬山') {
                window.location.href = 'https://ttt112132tttr.github.io/Xiushankejiguan/Sorawave.html';
            } else {
                error.textContent = '验证失败，请检查答案是否正确。';
            }
        }

        // 锁定框回车触发
        document.getElementById('dyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyLock();
        });
    </script>
</body>
</html>
