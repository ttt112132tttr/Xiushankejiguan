<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇迹馆之谜 - 问题3</title>
    <style>
        :root {
            --bg: #1a0f08;
            --card-bg: #231410;
            --gold: #c8a45c;
            --gold-light: #e0c680;
            --text: #d4c5b2;
            --text-light: #e8dcc8;
            --dark-border: #3a2215;
            --font-serif: 'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', 'Songti SC', serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a0f08;
            background-image: radial-gradient(ellipse at center, rgba(180, 120, 40, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse at 70% 80%, rgba(160, 80, 30, 0.05) 0%, transparent 60%);
            color: #d4c5b2;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', 'Songti SC', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            letter-spacing: 0.04em;
            line-height: 1.7;
        }
        .container {
            background: #231410;
            border: 1px solid #3a2215;
            border-radius: 4px;
            padding: 40px 36px 32px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(200, 150, 70, 0.08) inset;
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 16px;
            right: 16px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 150, 70, 0.25), transparent);
            pointer-events: none;
        }
        .ornament-top {
            text-align: center;
            color: #c8a45c;
            font-size: 18px;
            margin-bottom: 16px;
            letter-spacing: 0.3em;
            opacity: 0.7;
            user-select: none;
        }
        .question-label {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: #8b6d4a;
            margin-bottom: 8px;
            user-select: none;
        }
        .question-text {
            font-size: 1.05rem;
            color: #e8dcc8;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 0.06em;
            line-height: 1.9;
        }
        .input-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #6b4d30;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            user-select: none;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .input-field {
            flex: 1;
            min-width: 180px;
            max-width: 340px;
            padding: 11px 16px;
            font-size: 1rem;
            letter-spacing: 0.08em;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background: #1a0d06;
            border: 1px solid #3a2215;
            border-radius: 2px;
            color: #d4b880;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            border-color: #7a3a18;
            box-shadow: 0 0 14px rgba(180, 100, 30, 0.15);
        }
        .input-field::placeholder {
            color: #4a3020;
            letter-spacing: 0.06em;
        }
        .btn-submit {
            padding: 11px 24px;
            font-size: 1rem;
            letter-spacing: 0.2em;
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'SimSun', serif;
            cursor: pointer;
            border: 1px solid #5a3018;
            border-radius: 2px;
            background: #2a1408;
            color: #c89050;
            transition: all 0.3s;
            user-select: none;
            white-space: nowrap;
        }
        .btn-submit:hover {
            background: #3a1a0a;
            border-color: #8b4a20;
            color: #e0b870;
            box-shadow: 0 0 18px rgba(200, 120, 40, 0.25);
        }
        @media (max-width: 500px) {
            .container {
                padding: 24px 14px 20px;
            }
            .question-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ornament-top">◆ ◇ ◆</div>
        <div class="question-label">— 问 题 3 —</div>
        <p class="question-text">
            既然凶手是那个失踪女性工作人员，那么她不可能是自杀，而警方又断定死者是这个失踪的女性工作人员。问题来了，那具烧焦的尸体如何而来？
        </p>
        <div class="input-hint">输入地点/空间</div>
        <div class="input-row">
            <input type="text" class="input-field" id="answerInput" placeholder="" autocomplete="off">
            <button class="btn-submit" id="btnSubmit">确 定</button>
        </div>
    </div>
    <script>
        (function() {
            const correctAnswer = '追日馆';
            const input = document.getElementById('answerInput');
            const btn = document.getElementById('btnSubmit');

            function checkAnswer() {
                const val = input.value.trim();
                if (val === correctAnswer) {
                    window.location.href = 'Q4.html';
                } else {
                    input.value = '';
                }
            }
            btn.addEventListener('click', checkAnswer);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') checkAnswer();
            });
        })();
    </script>
</body>
</html>
